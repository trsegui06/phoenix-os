name: Phoenix Release Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phoenix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: true
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 11.16.0

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify exact toolchain
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Static quality gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify exact toolchain
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Run unit-compatible suite
        run: pnpm test

  supabase-integration:
    name: Supabase Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify exact toolchain
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Bridge versioned migrations
        run: ln -s ../database/migrations supabase/migrations
      - name: Start local Supabase and replay migrations
        run: |
          pnpm exec supabase start --agent no
          pnpm exec supabase db reset --local --no-seed
      - name: Run live integration suite
        run: |
          status="$(pnpm exec supabase status -o json)"
          api_url="$(jq -r '.API_URL' <<<"$status")"
          anon_key="$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' <<<"$status")"
          PHOENIX_SUPABASE_URL="$api_url" PHOENIX_SUPABASE_ANON_KEY="$anon_key" pnpm test
      - name: Verify generated database types are current
        run: |
          pnpm db:types
          git diff --exit-code -- lib/supabase/database.types.ts
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup --agent no

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify exact toolchain
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Use canonical Ubuntu package mirror
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Bridge versioned migrations
        run: ln -s ../database/migrations supabase/migrations
      - name: Start local Supabase
        run: pnpm exec supabase start --agent no
      - name: Run browser journeys with local Auth and Mailpit
        run: |
          status="$(pnpm exec supabase status -o json)"
          api_url="$(jq -r '.API_URL' <<<"$status")"
          publishable_key="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<<"$status")"
          NEXT_PUBLIC_SUPABASE_URL="$api_url" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$publishable_key" \
          NEXT_PUBLIC_SITE_URL="http://127.0.0.1:3000" \
          pnpm test:e2e
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup --agent no

  build-security:
    name: Build & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify exact toolchain
        run: |
          node --version
          pnpm --version
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Build production application with synthetic local configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-local-placeholder
          NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
        run: pnpm build
